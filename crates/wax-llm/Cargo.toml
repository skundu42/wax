[package]
name = "wax-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line LLM inference with Candle, safetensors, GGUF, and Metal support"
documentation = "https://docs.rs/wax-llm"
readme = "../../README.md"

[[bin]]
name = "wax"
path = "src/main.rs"

[features]
default = []
accelerate = ["wax-core/accelerate"]
cuda = ["wax-core/cuda"]
metal = ["wax-core/metal"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
wax-core = { path = "../wax-core", version = "0.1.0" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile.workspace = true
