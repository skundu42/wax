[workspace]
members = [
    "crates/wax-bench",
    "crates/wax-core",
    "crates/wax-llm",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
ahash = "0.8"
anyhow = "1"
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
clap = { version = "4.5", features = ["derive"] }
rand = "0.9"
safetensors = "0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
tempfile = "3"
thiserror = "2"
tokenizers = { version = "0.22.0", features = ["onig"] }
tracing = "0.1"
