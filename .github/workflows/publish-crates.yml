name: Publish crates

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish crates.io release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.release.target_commitish == 'main'
    environment: crates.io

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release tag matches workspace version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "wax-core") | .version')"
          expected="v${version}"
          actual="${RELEASE_TAG}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Release tag must match workspace version."
            echo "Expected: ${expected}"
            echo "Actual:   ${actual}"
            exit 1
          fi

      - name: Run release checks
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets --no-default-features -- -D warnings
          cargo test --workspace --no-default-features

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "wax-core") | .version')"

          crate_published() {
            local crate="$1"
            local tmpdir
            tmpdir="$(mktemp -d)"
            (
              cd "${tmpdir}"
              cargo info "${crate}@${version}" >/dev/null 2>&1
            )
          }

          publish_crate() {
            local crate="$1"
            if crate_published "${crate}"; then
              echo "${crate} ${version} is already published; skipping"
              return 0
            fi

            for attempt in {1..6}; do
              echo "Publishing ${crate} ${version} (attempt ${attempt})"
              if cargo publish -p "${crate}" --locked --dry-run && cargo publish -p "${crate}" --locked; then
                return 0
              fi

              if crate_published "${crate}"; then
                echo "${crate} ${version} is already published; continuing"
                return 0
              fi

              sleep 20
            done

            echo "Failed to publish ${crate} ${version}"
            exit 1
          }

          publish_crate wax-core
          publish_crate wax-bench
          publish_crate wax-llm
